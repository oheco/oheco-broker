# Linux host networking: HTTPS TCP 3478 and TURN UDP 3478 are independent.
# Mount the whole exported certificate directory so renewal replaces are visible.
services:
  broker:
    image: ${BROKER_IMAGE:-ghcr.io/oheco/oheco-broker:0.4.0}
    user: "10001:10001"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    environment:
      XDG_CONFIG_HOME: /var/lib/oheco-broker/config
    command:
      - --listen=0.0.0.0:${BROKER_HTTPS_PORT:-3478}
      - --db=/var/lib/oheco-broker/db/control.sqlite
      - --admin-token-file=/run/oheco-broker/secrets/admin.token
      - --registration=approval
      - --registration-relay=false
      - --tls-cert=/run/oheco-broker/tls/fullchain.pem
      - --tls-key=/run/oheco-broker/tls/privkey.pem
      - --tls-reload-interval=30s
      - --turn-listen=0.0.0.0:3478
      - --turn-public-ip=${BROKER_PUBLIC_IPV4:?set the externally reachable IPv4}
      - --turn-relay-min-port=${BROKER_RELAY_MIN_PORT:-50000}
      - --turn-relay-max-port=${BROKER_RELAY_MAX_PORT:-50100}
    volumes:
      - type: bind
        source: ${BROKER_DATA_DIR:?set the prepared absolute data directory}
        target: /var/lib/oheco-broker
        bind:
          create_host_path: false
      - type: bind
        source: ${BROKER_SECRETS_DIR:?set the prepared absolute secrets directory}
        target: /run/oheco-broker/secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BROKER_CERT_DIR:?set the prepared absolute certificate export directory}
        target: /run/oheco-broker/tls
        read_only: true
        bind:
          create_host_path: false
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
